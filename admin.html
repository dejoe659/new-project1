  const b=new Blob([L.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"}),u=document.createElement("a");u.href=URL.createObjectURL(b);u.download="event-registrations.csv";u.click()}}

// ---- Care team: prayer and counselling requests (private; every call goes through the server, which checks who you are)
const careCall=async b=>{const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("Please sign in again.");
 const r=await fetch("/api/comms/care",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+session.access_token},body:JSON.stringify(b)});
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Something went wrong.");e.code=r.status;throw e}return j};
let acadMounted=null;
async function acadCall(b){const{data:{session}}=await sb.auth.getSession();const r=await fetch("/api/comms/academic",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+(session?session.access_token:"")},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Something went wrong.");return j}
function renderAcad(){V.innerHTML='<p>Loading academic help...</p><div id="acmount"></div>';try{if(!window.AcadConsole)throw new Error("The academic help script did not load. Refresh the page (Ctrl+Shift+R), or clear this site\'s data, and try again.");AcadConsole.mount($("#acmount"),acadCall);setTimeout(()=>{const l=V.querySelector("p");if(l&&l.textContent.startsWith("Loading academic")&&$("#acmount").children.length)l.remove()},1500)}catch(x){V.innerHTML=`<p class="msg err">${esc(x.message)}</p>`}}
const CSTAT={new:"New",in_progress:"In progress",prayed:"Prayed",follow_up:"Needs follow-up",closed:"Closed"};
let careFilter="";
async function renderCare(){
 try{const a=await careCall({action:"access"});let html="";
  if(!a.role)html+=`<h2>Prayer and counselling</h2><p>You are not on the care team, so you cannot read requests. Requests are private and only people added to the care team can see them.${a.super_admin?" As a super administrator you can add people below.":" Ask a super administrator to add you."}</p>`;
  else{const l=await careCall({action:"list",status:careFilter});
   html+=`<h2>Prayer and counselling <span class="tag">${a.role==="counsellor"?"counsellor":"prayer team"}</span></h2><p><small>Requests are private. Opening one is recorded in the audit log. ${a.role==="prayer"?"You can see prayer requests marked for the prayer team.":""}</small></p>
   <label>Show<select id="cf"><option value="">All</option>${Object.entries(CSTAT).map(([k,v])=>`<option value="${k}" ${k===careFilter?"selected":""}>${v}</option>`).join("")}</select></label>
   ${l.requests.length?l.requests.map(r=>`<div class="row"><h3>${esc(r.kind==="counselling"?"Counselling":"Prayer")}: ${esc(r.category)} <span class="tag">${esc(CSTAT[r.status]||r.status)}</span> ${r.privacy==="counsellors_only"?'<span class="tag">counsellors only</span>':""}</h3>${dl({From:r.who,Received:new Date(r.created_at).toLocaleString("en-GB",{timeZone:"Africa/Lagos"})})}<button data-care="open" data-id="${r.id}">Open</button></div>`).join(""):"<p>No requests.</p>"}`}
  if(a.super_admin){const t=await careCall({action:"team"});
   html+=`<h2>Care team</h2><p><small>Only people listed here can read requests. They must already have an administrator login.</small></p>${t.team.map(m=>`<div class="row">${esc(m.email)} <span class="tag">${m.role==="counsellor"?"counsellor":"prayer team"}</span> <button data-care="rm" data-id="${m.id}" class="no">Remove</button></div>`).join("")||"<p>Nobody yet.</p>"}
   <form id="tf" class="form"><label>Email of an administrator<input name="email" type="email" required></label><label>Role<select name="role"><option value="prayer">Prayer team (open prayer requests only)</option><option value="counsellor">Counsellor (everything)</option></select></label><button class="btn">Add to care team</button><p class="msg" id="tm" role="status"></p></form>`}
  V.innerHTML=html;
  if($("#cf"))$("#cf").onchange=e=>{careFilter=e.target.value;renderCare()};
  if($("#tf"))$("#tf").onsubmit=async e=>{e.preventDefault();const tm=$("#tm");try{await careCall({action:"team_add",email:e.target.elements.email.value,role:e.target.elements.role.value});renderCare()}catch(x){tm.textContent=x.message;tm.className="msg err"}};
 }catch(x){V.innerHTML=`<p class="msg err">${esc(x.message)}</p>`}}
async function careClick(b){const id=b.dataset.id,a=b.dataset.care;
 try{if(a==="rm"){if(!confirm("Remove this person from the care team?"))return;await careCall({action:"team_remove",id});return renderCare()}
  if(a==="open"){const{request:r}=await careCall({action:"get",id});
   V.innerHTML=`<p><button data-care="back">Back to requests</button></p><h2>${esc(r.kind==="counselling"?"Counselling":"Prayer")} request: ${esc(r.category)}</h2>${dl({From:r.anonymous?"Anonymous":r.name,Phone:r.phone,Email:r.email,Received:new Date(r.created_at).toLocaleString("en-GB",{timeZone:"Africa/Lagos"}),"Who may read":r.privacy==="counsellors_only"?"Counsellors only":"Prayer team","Last handled by":r.handled_by})}
   <p style="white-space:pre-wrap;border-left:3px solid #14451f;padding-left:.8rem">${esc(r.message)}</p>
   <form id="cu" class="form" data-id="${r.id}"><label>Status<select name="status">${Object.entries(CSTAT).map(([k,v])=>`<option value="${k}" ${k===r.status?"selected":""}>${v}</option>`).join("")}</select></label><label>Team note (private, never shown to the person)<textarea name="note" rows="3" maxlength="2000">${esc(r.team_note||"")}</textarea></label><button class="btn">Save</button> ${r.status==="closed"?`<button type="button" class="no" data-care="del" data-id="${r.id}">Delete permanently</button>`:""}<p class="msg" id="cum" role="status"></p></form>`;
   $("#cu").onsubmit=async e=>{e.preventDefault();const m=$("#cum");try{await careCall({action:"update",id:r.id,status:e.target.elements.status.value,team_note:e.target.elements.note.value});m.textContent="Saved.";m.className="msg ok"}catch(x){m.textContent=x.message;m.className="msg err"}};return}
  if(a==="back")return renderCare();
  if(a==="del"){if(!confirm("Delete this request permanently? This cannot be undone."))return;await careCall({action:"delete",id});return renderCare()}
 }catch(x){alert(x.message)}}
// ---- Sermons and resources: add, edit, upload audio or PDF, feature, publish, delete
let editRes=null;const RKIND={sermon:"Sermon",audio:"Audio message",video:"Video teaching",study:"Bible study",discipleship:"Discipleship",devotional:"Devotional",fresher:"Freshers' guide",academic:"Academic support"};
const SERMON_BASE="/storage/v1/object/public/sermons/";
async function renderRes(){
 const{data,error}=await sb.from("resources").select("*").order("published_on",{ascending:false}).order("created_at",{ascending:false});if(error)return V.textContent=error.message;
 const e=editRes&&data.find(x=>x.id===editRes)||{};
 V.innerHTML=`<form id="rf" class="form"><h2>${e.id?"Edit resource":"Add a sermon or resource"}</h2>
 <label>Type<select name="kind">${Object.entries(RKIND).map(([k,v])=>`<option value="${k}" ${k===(e.kind||"sermon")?"selected":""}>${v}</option>`).join("")}</select></label>
 <label>Title<input name="title" required maxlength="150" value="${esc(e.title||"")}"></label>
 <label>Speaker or author<input name="speaker" maxlength="120" value="${esc(e.speaker||"")}"></label>
 <label>Topic (for example Faith, Prayer, Purity, Exams)<input name="category" maxlength="60" value="${esc(e.category||"")}"></label>
 <label>Date<input name="published_on" type="date" required value="${esc(e.published_on||new Date().toISOString().slice(0,10))}"></label>
 <label>Short description<textarea name="description" rows="2" maxlength="600">${esc(e.description||"")}</textarea></label>
 <label>Written content (devotional text or study notes, optional)<textarea name="body" rows="6" maxlength="10000">${esc(e.body||"")}</textarea></label>
 <label>Link (YouTube, or any https link, optional)<input name="url" type="url" placeholder="https://" value="${esc(e.url&&!e.url.includes(SERMON_BASE)?e.url:"")}"></label>
 <label>Or upload an audio file (MP3, M4A, WAV, OGG) or a PDF, up to 50 MB<input name="file" type="file" accept="audio/mpeg,audio/mp4,audio/x-m4a,audio/wav,audio/ogg,application/pdf,.mp3,.m4a,.wav,.ogg,.pdf"></label>${e.url&&e.url.includes(SERMON_BASE)?`<p><small>An uploaded file is attached. Choosing a new file or pasting a link replaces it.</small></p>`:""}
 <label class="ck"><input type="checkbox" name="is_featured" ${e.is_featured?"checked":""}> Feature this on the page</label>
 <label class="ck"><input type="checkbox" name="is_published" ${e.id&&!e.is_published?"":"checked"}> Published (visible on the website)</label>
 <button class="btn">${e.id?"Save changes":"Add"}</button>${e.id?'<button type="button" class="btn" id="rcancel">Cancel</button>':""}<p class="msg" id="rm2" role="status"></p></form>`+
 (data.length?"":"<p>Nothing added yet.</p>")+data.map(x=>`<div class="row"><h3>${esc(x.title)} <span class="tag">${esc(RKIND[x.kind]||x.kind)}</span> ${x.is_featured?'<span class="tag">featured</span>':""} ${x.is_published?"":'<span class="tag">hidden</span>'}</h3>${dl({Speaker:x.speaker,Topic:x.category,Date:x.published_on,Link:x.url})}<div><button data-res="edit" data-id="${x.id}">Edit</button><button data-res="feat" data-id="${x.id}">${x.is_featured?"Unfeature":"Feature"}</button><button data-res="pub" data-id="${x.id}">${x.is_published?"Hide":"Publish"}</button><button data-res="del" data-id="${x.id}" class="no">Delete</button></div></div>`).join("");
 const m=$("#rm2"),say=(t,ok)=>{m.textContent=t;m.className="msg "+(ok?"ok":"err")};
 if($("#rcancel"))$("#rcancel").onclick=()=>{editRes=null;renderRes()};
 $("#rf").onsubmit=async ev=>{ev.preventDefault();const f=ev.target,b=f.querySelector("button.btn");b.disabled=true;say("");
  try{const fd=new FormData(f),title=String(fd.get("title")).trim();if(title.length<2)throw new Error("Give it a title.");
   const row={kind:fd.get("kind"),title,speaker:String(fd.get("speaker")).trim()||null,category:String(fd.get("category")).trim()||null,published_on:fd.get("published_on"),description:String(fd.get("description")).trim()||null,body:String(fd.get("body")).trim()||null,is_featured:f.elements.is_featured.checked,is_published:f.elements.is_published.checked};
   const link=String(fd.get("url")).trim();if(link&&!/^https:\/\/\S+$/i.test(link))throw new Error("The link must start with https://");
   const file=f.elements.file.files[0];
   if(file){if(file.size>52428800)throw new Error("That file is over 50 MB. For long recordings or video, upload to YouTube and paste the link.");
    const ext=((file.name.match(/\.([a-z0-9]+)$/i)||[])[1]||"").toLowerCase();if(!["mp3","m4a","wav","ogg","pdf"].includes(ext))throw new Error("Only MP3, M4A, WAV, OGG or PDF files can be uploaded.");
    const path=crypto.randomUUID()+"."+ext,up=await sb.storage.from("sermons").upload(path,file,{contentType:file.type||undefined});if(up.error)throw new Error("Upload failed: "+up.error.message);
    row.url=sb.storage.from("sermons").getPublicUrl(path).data.publicUrl}
   else if(link)row.url=link;
   else if(!e.id)row.url=null;
   if(!row.url&&!row.body&&!(e.id&&e.url))throw new Error("Add a link, a file, or some written content.");
   const r=editRes?await sb.from("resources").update(row).eq("id",editRes):await sb.from("resources").insert(row);if(r.error)throw new Error(r.error.message);
   editRes=null;renderRes()}catch(x){say(x.message);b.disabled=false}};
}
async function resClick(b){const id=b.dataset.id,a=b.dataset.res;
 try{if(a==="edit"){editRes=id;return renderRes()}
  const{data:x}=await sb.from("resources").select("*").eq("id",id).single();
  if(a==="feat"){const{error}=await sb.from("resources").update({is_featured:!x.is_featured}).eq("id",id);if(error)throw error;return renderRes()}
  if(a==="pub"){const{error}=await sb.from("resources").update({is_published:!x.is_published}).eq("id",id);if(error)throw error;return renderRes()}
  if(a==="del"){if(!confirm("Delete this permanently?"))return;
   if(x.url&&x.url.includes(SERMON_BASE)){const p=decodeURIComponent(x.url.split(SERMON_BASE)[1]||"");if(p)await sb.storage.from("sermons").remove([p])}
   const{error}=await sb.from("resources").delete().eq("id",id);if(error)throw error;return renderRes()}
 }catch(x){alert(x.message)}}
V.onclick=async e=>{const rb=e.target.closest("button[data-res]");if(rb)return resClick(rb);const cb=e.target.closest("button[data-care]");if(cb)return careClick(cb);const evb=e.target.closest("button[data-ev]");if(evb)return eventClick(evb);const b=e.target.closest("button[data-act]");if(!b)return;const{t,id,act}=b.dataset;let q;
 if(act==="del"){if(!confirm("Delete this permanently?"))return;if(t==="members"){const{data}=await sb.from("members").select("photo_url").eq("id",id).single();const p=data&&data.photo_url&&data.photo_url.split("/member-photos/")[1];if(p)await sb.storage.from("member-photos").remove([p])}if(t==="gallery"){const{data}=await sb.from("gallery").select("url").eq("id",id).single();const p=data&&data.url.split("/gallery/")[1];if(p)await sb.storage.from("gallery").remove([p])}q=sb.from(t).delete().eq("id",id)}
 else if(t==="members"){const m=cache[id],u={approve:{review_status:"approved",profile_approved:!!m.consent_public},reject:{review_status:"rejected",profile_approved:false},hide:{profile_approved:false},show:{profile_approved:true}}[act];q=sb.from(t).update(u).eq("id",id)}
 else q=sb.from(t).update({status:act==="approve"?"approved":"rejected"}).eq("id",id);
 const{error}=await q;error?alert(error.message):render()};
boot();
</script></body></html>
