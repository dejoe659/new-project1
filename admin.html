<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | DCF UNN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Libre+Franklin:wght@400;500;600&display=swap"><link rel="stylesheet" href="/assets/style.css">
<style>.bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}.tabs{display:flex;gap:.5rem;margin:1rem 0;flex-wrap:wrap}.tabs button{border:1px solid var(--navy);background:none;padding:.5rem 1rem;border-radius:99px;cursor:pointer;font:inherit}.tabs .on{background:var(--navy);color:#fff}
.row{background:var(--grey);padding:1rem;margin:.8rem 0;border-left:5px solid var(--gold)}.row h3{margin:0 0 .3rem}.row dl{display:grid;grid-template-columns:auto 1fr;gap:.1rem .8rem;margin:.4rem 0;font-size:.92rem}.row dt{color:#55627a}.row dd{margin:0;overflow-wrap:anywhere}
.row button{margin:.2rem .3rem 0 0;padding:.4rem .8rem;border:1px solid var(--navy);background:#fff;border-radius:3px;cursor:pointer;font:inherit}.row .ok{background:var(--navy);color:#fff}.row .no{border-color:#a11;color:#a11}.tag{display:inline-block;font-size:.75rem;padding:.1rem .5rem;border-radius:99px;background:var(--gold);color:var(--navy);font-weight:600}
.row img{max-width:200px;display:block;margin:.4rem 0}</style></head><body>
<main><section id="login" class="narrow"><h1>Admin sign in</h1><form id="lf" class="form"><label>Email<input id="em" type="email" required autocomplete="username"></label><label>Password<input id="pw" type="password" required autocomplete="current-password"></label><button class="btn">Sign in</button><p class="msg" id="lm" role="status"></p></form><p><a href="#" id="fg">Forgot password?</a></p></section>
<section id="app" hidden><div class="bar"><strong id="who"></strong><button class="btn sm" id="out">Sign out</button></div>
<div class="tabs" id="tabs"><button data-t="members" class="on">Registrations</button><button data-t="testimonies">Testimonies</button><button data-t="events">Events</button><button data-t="gallery">Gallery</button></div><div id="view"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const U="https://takdaiqvaxancqrqwwhy.supabase.co",K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRha2RhaXF2YXhhbmNxcnF3d2h5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDkyNDUsImV4cCI6MjEwODc4NTI0NX0.cMNEb_tr1gRtVRwJa5kQqvqctyR9UjdroJ34umG4L8Q";
const sb=supabase.createClient(U,K),$=s=>document.querySelector(s),V=$("#view");let tab="members",cache={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show=a=>{$("#login").hidden=a;$("#app").hidden=!a};
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return show(false);
 const{data}=await sb.from("admins").select("role").maybeSingle();
 if(!data){$("#lm").textContent="This account is not an administrator.";await sb.auth.signOut();return show(false)}
 $("#who").textContent=session.user.email+" ("+data.role+")";show(true);render()}
$("#lf").onsubmit=async e=>{e.preventDefault();$("#lm").textContent="";const{error}=await sb.auth.signInWithPassword({email:$("#em").value,password:$("#pw").value});
 if(error)$("#lm").textContent="Sign in failed: "+error.message;else boot()};
$("#fg").onclick=async e=>{e.preventDefault();if(!$("#em").value)return $("#lm").textContent="Enter your email first.";
 await sb.auth.resetPasswordForEmail($("#em").value,{redirectTo:location.origin+"/admin"});$("#lm").textContent="If that account exists, a reset email was sent."};
sb.auth.onAuthStateChange(async ev=>{if(ev==="PASSWORD_RECOVERY"){const p=prompt("Enter a new password (at least 8 characters):");if(p&&p.length>=8){const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:"Password updated.")}}});
$("#out").onclick=async()=>{await sb.auth.signOut();show(false)};
$("#tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;[...$("#tabs").children].forEach(b=>b.classList.toggle("on",b.dataset.t===t));render()};
const dl=(o)=>"<dl>"+Object.entries(o).filter(([,v])=>v!==null&&v!=="").map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")+"</dl>";
const btn=(t,id,act,l,c="")=>`<button class="${c}" data-t="${t}" data-id="${id}" data-act="${act}">${l}</button>`;
async function render(){V.innerHTML="Loading...";
 if(tab==="members"){const{data,error}=await sb.from("members").select("*").order("created_at",{ascending:false});if(error)return V.textContent=error.message;cache=Object.fromEntries(data.map(r=>[r.id,r]));
  V.innerHTML=(data.length?"":"<p>No registrations yet.</p>")+data.map(m=>`<div class="row"><h3>${esc(m.full_name)} <span class="tag">${m.review_status}</span> ${m.profile_approved?'<span class="tag">public</span>':""}</h3>`+dl({Email:m.email,Phone:m.phone,"Date of birth":m.date_of_birth,State:m.state_of_origin,LGA:m.local_government,Faculty:m.faculty,Department:m.department,Course:m.course,Level:m.level,Status:m.status,"Skills/business":m.skills_business,Interests:m.interests,Intro:m.intro,Bio:m.bio,"Wants public profile":m.consent_public?"Yes":"No",Registered:new Date(m.created_at).toLocaleString()})+
   btn("members",m.id,"approve","Approve","ok")+btn("members",m.id,"reject","Reject")+(m.consent_public?(m.profile_approved?btn("members",m.id,"hide","Hide from directory"):btn("members",m.id,"show","Show in directory")):"")+btn("members",m.id,"del","Delete","no")+"</div>").join("")}
 if(tab==="testimonies"){const{data,error}=await sb.from("testimonies").select("*").order("created_at",{ascending:false});if(error)return V.textContent=error.message;
  V.innerHTML=(data.length?"":"<p>No testimonies yet.</p>")+data.map(t=>`<div class="row"><h3>${esc(t.title)} <span class="tag">${t.status}</span></h3>`+dl({By:t.name||"Anonymous",Category:t.category,Email:t.email,Testimony:t.content,Submitted:new Date(t.created_at).toLocaleString()})+
   btn("testimonies",t.id,"approve","Approve and publish","ok")+btn("testimonies",t.id,"reject","Reject")+btn("testimonies",t.id,"del","Delete","no")+"</div>").join("")}
 if(tab==="events"){const{data,error}=await sb.from("events").select("*").order("date");if(error)return V.textContent=error.message;
  V.innerHTML=`<form id="ef" class="form"><h2>Add event or announcement</h2><label>Title<input name="title" required></label><label>Date and time (for example: Sat 7 Nov, 4 PM)<input name="date"></label><label>Venue<input name="venue"></label><label>Details<textarea name="details" rows="3"></textarea></label><button class="btn">Add</button></form>`+data.map(e=>`<div class="row"><h3>${esc(e.title)}</h3>`+dl({When:e.date,Venue:e.venue,Details:e.details})+btn("events",e.id,"del","Delete","no")+"</div>").join("");
  $("#ef").onsubmit=async ev=>{ev.preventDefault();const{error}=await sb.from("events").insert(Object.fromEntries(new FormData(ev.target)));error?alert(error.message):render()}}
 if(tab==="gallery"){const{data,error}=await sb.from("gallery").select("*").order("date",{ascending:false});if(error)return V.textContent=error.message;
  V.innerHTML=`<form id="gf" class="form"><h2>Upload photo</h2><label>Photo (JPG, PNG or WebP, max 5 MB)<input type="file" name="file" accept="image/jpeg,image/png,image/webp" required></label><label>Event title<input name="event" required></label><label>Category<select name="category"><option>Celebration Service</option><option>Bible Study</option><option>Prayer Meetings</option><option>Evangelism</option><option>Conferences</option><option>Outreaches</option><option>Fellowship Gatherings</option></select></label><label>Date<input type="date" name="date"></label><label>Caption<input name="caption"></label><button class="btn">Upload</button><p class="msg" id="gm"></p></form>`+data.map(g=>`<div class="row"><img src="${esc(g.url)}" alt=""><h3>${esc(g.event)}</h3>`+dl({Category:g.category,Date:g.date,Caption:g.caption})+btn("gallery",g.id,"del","Delete","no")+"</div>").join("");
  $("#gf").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),file=f.get("file");if(file.size>5242880)return $("#gm").textContent="File is over 5 MB.";$("#gm").textContent="Uploading...";
   const path=Date.now()+"-"+file.name.replace(/[^\w.-]/g,"_"),up=await sb.storage.from("gallery").upload(path,file,{contentType:file.type});if(up.error)return $("#gm").textContent=up.error.message;
   const{error}=await sb.from("gallery").insert({event:f.get("event"),category:f.get("category"),date:f.get("date")||null,caption:f.get("caption"),url:U+"/storage/v1/object/public/gallery/"+path});error?$("#gm").textContent=error.message:render()}}}
V.onclick=async e=>{const b=e.target.closest("button[data-act]");if(!b)return;const{t,id,act}=b.dataset;let q;
 if(act==="del"){if(!confirm("Delete this permanently?"))return;if(t==="gallery"){const{data}=await sb.from("gallery").select("url").eq("id",id).single();const p=data&&data.url.split("/gallery/")[1];if(p)await sb.storage.from("gallery").remove([p])}q=sb.from(t).delete().eq("id",id)}
 else if(t==="members"){const m=cache[id],u={approve:{review_status:"approved",profile_approved:!!m.consent_public},reject:{review_status:"rejected",profile_approved:false},hide:{profile_approved:false},show:{profile_approved:true}}[act];q=sb.from(t).update(u).eq("id",id)}
 else q=sb.from(t).update({status:act==="approve"?"approved":"rejected"}).eq("id",id);
 const{error}=await q;error?alert(error.message):render()};
boot();
</script></body></html>
